<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Handwriting Device</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .device-container {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 1000px;
            height: 600px;
            display: flex;
            gap: 20px;
        }
        .device-left {
            flex: 0 0 220px;
            background: #34495e;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .oled {
            background: #000;
            color: #0ff;
            border-radius: 8px;
            padding: 8px;
            height: 350px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            border: 2px solid #555;
            margin-bottom: 10px;
            overflow-y: auto;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        .btn:hover { background: #c0392b; }
        .search-btn { background: #27ae60; }
        .search-btn:hover { background: #229954; }
        .device-right {
            flex: 1;
            background: #ecf0f1;
            border-radius: 15px;
            padding: 10px;
        }
        .epaper {
            width: 100%;
            height: 100%;
            background: #fff;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            position: relative;
            cursor: crosshair;
        }
        .canvas { width: 100%; height: 100%; position: absolute; z-index: 2; }
        .dots { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #3498db;
            border-radius: 50%;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }
        .menu-item { padding: 2px; margin: 1px 0; border-radius: 3px; }
        .menu-item.active { background: #0ff; color: #000; }
        .colored-text { color: #ff6b6b; }
        .colored-bg { background: #4ecdc4; color: #000; padding: 2px; border-radius: 2px; }
        .feedback { color: #00ff00; font-size: 12px; }
        .error { color: #ff0000; }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .welcome {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }
        .start-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="device-left">
            <div class="oled" id="oled"></div>
            <div class="controls">
                <button class="btn" onclick="nav('up')">▲ UP</button>
                <button class="btn" onclick="nav('select')">SELECT</button>
                <button class="btn" onclick="nav('down')">▼ DOWN</button>
                <button class="btn" onclick="nav('back')">◀ BACK</button>
                <button class="btn" onclick="clearDraw()">CLEAR</button>
                <button class="btn search-btn" onclick="toggleSearch()">🔍 SEARCH</button>
            </div>
        </div>
        <div class="device-right">
            <div class="welcome" id="welcome">
                <div style="font-size: 48px; color: #3498db; margin-bottom: 20px;">✏️ Handwriting Helper</div>
                <div style="font-size: 24px; color: #7f8c8d; margin-bottom: 40px;">Learn to write!</div>
                <button class="start-btn" onclick="start()">Start Learning</button>
            </div>
            <div class="epaper">
                <div class="dots" id="dots"></div>
                <canvas class="canvas" id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let state = 'menu', sel = 0, lang = 'en', mod = '', ex = 0, canvas, ctx, drawing = false, searchMode = false, searchQuery = '', searchResult = '', strokes = [], feedbackTimeout;

        const data = {
            langs: ['English', '中文', '日本語', 'Español'],
            codes: ['en', 'zh', 'ja', 'es'],
            mods: ['Letters', 'Numbers', 'Words'],
            examples: {
                letters: {
                    en: ['A', 'B', 'C', 'D', 'E'],
                    zh: ['一', '二', '三', '四', '五'],
                    ja: ['あ', 'い', 'う', 'え', 'お'],
                    es: ['A', 'B', 'C', 'D', 'E']
                },
                numbers: {
                    en: ['1', '2', '3', '4', '5'],
                    zh: ['1', '2', '3', '4', '5'],
                    ja: ['1', '2', '3', '4', '5'],
                    es: ['1', '2', '3', '4', '5']
                },
                words: {
                    en: ['CAT', 'DOG', 'SUN', 'MOON', 'STAR'],
                    zh: ['猫', '狗', '太阳', '月亮', '星星'],
                    ja: ['ねこ', 'いぬ', 'たいよう', 'つき', 'ほし'],
                    es: ['GATO', 'PERRO', 'SOL', 'LUNA', 'ESTRELLA']
                }
            }
        };

        const dots = {
            'A': [{x: 50, y: 15}, {x: 40, y: 35}, {x: 60, y: 35}, {x: 30, y: 55}, {x: 70, y: 55}, {x: 45, y: 40}, {x: 55, y: 40}],
            'B': [{x: 30, y: 15}, {x: 30, y: 35}, {x: 30, y: 55}, {x: 30, y: 75}, {x: 50, y: 15}, {x: 50, y: 35}, {x: 50, y: 55}, {x: 50, y: 75}],
            'C': [{x: 60, y: 20}, {x: 50, y: 15}, {x: 35, y: 20}, {x: 30, y: 35}, {x: 30, y: 55}, {x: 35, y: 70}, {x: 50, y: 75}, {x: 60, y: 70}],
            'D': [{x: 30, y: 15}, {x: 30, y: 35}, {x: 30, y: 55}, {x: 30, y: 75}, {x: 50, y: 15}, {x: 60, y: 25}, {x: 65, y: 45}, {x: 60, y: 65}, {x: 50, y: 75}],
            'E': [{x: 30, y: 15}, {x: 30, y: 35}, {x: 30, y: 55}, {x: 30, y: 75}, {x: 60, y: 15}, {x: 50, y: 35}, {x: 60, y: 75}],
            '1': [{x: 50, y: 15}, {x: 50, y: 35}, {x: 50, y: 55}, {x: 50, y: 75}, {x: 45, y: 20}],
            '2': [{x: 35, y: 20}, {x: 50, y: 15}, {x: 65, y: 20}, {x: 50, y: 35}, {x: 35, y: 50}, {x: 50, y: 65}, {x: 65, y: 75}],
            '3': [{x: 35, y: 20}, {x: 50, y: 15}, {x: 65, y: 20}, {x: 50, y: 35}, {x: 65, y: 50}, {x: 50, y: 65}, {x: 35, y: 70}],
            '4': [{x: 40, y: 15}, {x: 40, y: 35}, {x: 30, y: 55}, {x: 50, y: 55}, {x: 70, y: 55}, {x: 60, y: 35}, {x: 60, y: 75}],
            '5': [{x: 65, y: 15}, {x: 35, y: 15}, {x: 35, y: 35}, {x: 55, y: 35}, {x: 65, y: 45}, {x: 65, y: 65}, {x: 55, y: 75}, {x: 35, y: 75}],
            '一': [{x: 25, y: 45}, {x: 40, y: 45}, {x: 55, y: 45}, {x: 70, y: 45}],
            '二': [{x: 25, y: 35}, {x: 40, y: 35}, {x: 55, y: 35}, {x: 70, y: 35}, {x: 25, y: 55}, {x: 40, y: 55}, {x: 55, y: 55}, {x: 70, y: 55}],
            '三': [{x: 25, y: 25}, {x: 40, y: 25}, {x: 55, y: 25}, {x: 70, y: 25}, {x: 25, y: 45}, {x: 40, y: 45}, {x: 55, y: 45}, {x: 70, y: 45}, {x: 25, y: 65}, {x: 40, y: 65}, {x: 55, y: 65}, {x: 70, y: 65}],
            '四': [{x: 30, y: 15}, {x: 30, y: 30}, {x: 30, y: 45}, {x: 30, y: 60}, {x: 30, y: 75}, {x: 70, y: 15}, {x: 70, y: 30}, {x: 70, y: 45}, {x: 70, y: 60}, {x: 70, y: 75}, {x: 15, y: 45}, {x: 50, y: 45}, {x: 85, y: 45}],
            '五': [{x: 30, y: 15}, {x: 50, y: 15}, {x: 70, y: 15}, {x: 30, y: 30}, {x: 50, y: 30}, {x: 70, y: 30}, {x: 30, y: 45}, {x: 50, y: 45}, {x: 70, y: 45}, {x: 30, y: 60}, {x: 50, y: 60}, {x: 70, y: 60}, {x: 30, y: 75}, {x: 50, y: 75}, {x: 70, y: 75}],
            'あ': [{x: 40, y: 20}, {x: 50, y: 25}, {x: 60, y: 30}, {x: 45, y: 40}, {x: 55, y: 50}, {x: 50, y: 65}, {x: 35, y: 55}],
            'い': [{x: 40, y: 15}, {x: 40, y: 30}, {x: 40, y: 45}, {x: 40, y: 60}, {x: 40, y: 75}, {x: 60, y: 20}, {x: 60, y: 35}, {x: 60, y: 50}, {x: 60, y: 65}],
            'う': [{x: 35, y: 20}, {x: 50, y: 15}, {x: 65, y: 20}, {x: 50, y: 30}, {x: 40, y: 45}, {x: 60, y: 55}, {x: 50, y: 70}],
            'え': [{x: 30, y: 25}, {x: 50, y: 20}, {x: 70, y: 25}, {x: 40, y: 40}, {x: 60, y: 45}, {x: 35, y: 60}, {x: 55, y: 65}, {x: 50, y: 80}],
            'お': [{x: 35, y: 15}, {x: 50, y: 20}, {x: 65, y: 25}, {x: 40, y: 35}, {x: 60, y: 40}, {x: 45, y: 55}, {x: 55, y: 65}, {x: 50, y: 80}]
        };

        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resize();
            setupDraw();
            update();
        }

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
        }

        function setupDraw() {
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e.touches[0]); });
            canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
            canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(); });
        }

        function startDraw(e) {
            if (state !== 'writing') return;
            drawing = true;
            strokes = [];
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
            strokes.push({x, y});
        }

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            strokes.push({x, y});
        }

        function endDraw() {
            if (!drawing) return;
            drawing = false;
            if (strokes.length > 10) {
                setTimeout(checkWriting, 300);
            }
        }

        function checkWriting() {
            const isCorrect = Math.random() > 0.4;
            const current = data.examples[mod][lang][ex];
            
            if (isCorrect) {
                showFeedback(`✅ Great job! "${current}" is correct!`, 'feedback');
                setTimeout(() => {
                    ex++;
                    if (ex >= data.examples[mod][lang].length) ex = 0;
                    showExample();
                }, 2000);
            } else {
                showFeedback(`❌ Try again! Practice "${current}" more.`, 'error');
                setTimeout(() => {
                    showExample();
                }, 2000);
            }
        }

        function showFeedback(msg, type) {
            clearTimeout(feedbackTimeout);
            const oled = document.getElementById('oled');
            let html = `<div class="colored-text">WRITING FEEDBACK</div><div>================</div>`;
            html += `<div class="${type}">${msg}</div><div>----------------</div>`;
            html += `<div>Current: ${data.examples[mod][lang][ex]}</div>`;
            html += `<div>Module: ${mod}</div>`;
            html += `<div>Language: ${data.langs[data.codes.indexOf(lang)]}</div>`;
            oled.innerHTML = html;
        }

        function nav(action) {
            if (action === 'up') {
                if (state === 'menu') sel = (sel - 1 + data.langs.length) % data.langs.length;
                else if (state === 'modules') sel = (sel - 1 + data.mods.length) % data.mods.length;
                update();
            } else if (action === 'down') {
                if (state === 'menu') sel = (sel + 1) % data.langs.length;
                else if (state === 'modules') sel = (sel + 1) % data.mods.length;
                update();
            } else if (action === 'select') {
                if (searchMode) {
                    performSearch();
                } else if (state === 'menu') {
                    lang = data.codes[sel];
                    state = 'modules';
                    sel = 0;
                    update();
                } else if (state === 'modules') {
                    mod = data.mods[sel].toLowerCase();
                    ex = 0;
                    state = 'writing';
                    showExample();
                }
            } else if (action === 'back') {
                if (searchMode) {
                    searchMode = false;
                    searchQuery = '';
                    searchResult = '';
                    update();
                } else if (state === 'writing') {
                    state = 'modules';
                    sel = 0;
                    update();
                    clearDraw();
                } else if (state === 'modules') {
                    state = 'menu';
                    sel = 0;
                    update();
                }
            }
        }

        function showExample() {
            const current = data.examples[mod][lang][ex];
            showDots(current);
            update();
            clearDraw();
        }

        function showDots(char) {
            const container = document.getElementById('dots');
            container.innerHTML = '';
            
            const pattern = dots[char] || [{x: 50, y: 45}];
            pattern.forEach(dot => {
                const el = document.createElement('div');
                el.className = 'dot';
                el.style.left = dot.x + '%';
                el.style.top = dot.y + '%';
                container.appendChild(el);
            });
        }

        function clearDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function toggleSearch() {
            searchMode = !searchMode;
            if (searchMode) {
                searchQuery = '';
                searchResult = '';
            }
            update();
        }

        function update() {
            const oled = document.getElementById('oled');
            
            if (searchMode) {
                let html = '<div class="colored-text">🔍 AI SEARCH</div><div>================</div>';
                html += `<div>Query: ${searchQuery}<span style="animation: blink 1s infinite;">|</span></div>`;
                if (searchResult) {
                    html += '<div>----------------</div>';
                    html += `<div class="feedback">${searchResult}</div>`;
                }
                html += '<div>----------------</div>';
                html += '<div>Type & SELECT to search</div>';
                oled.innerHTML = html;
            } else if (state === 'menu') {
                let html = '<div class="colored-text">SELECT LANGUAGE</div><div>================</div>';
                data.langs.forEach((l, i) => {
                    const active = i === sel ? 'active' : '';
                    const arrow = i === sel ? '▶ ' : '  ';
                    html += `<div class="menu-item ${active}">${arrow}${l}</div>`;
                });
                oled.innerHTML = html;
            } else if (state === 'modules') {
                let html = '<div class="colored-text">SELECT MODULE</div><div>================</div>';
                html += `<div class="colored-bg">Lang: ${data.langs[data.codes.indexOf(lang)]}</div><div>----------------</div>`;
                data.mods.forEach((m, i) => {
                    const active = i === sel ? 'active' : '';
                    const arrow = i === sel ? '▶ ' : '  ';
                    html += `<div class="menu-item ${active}">${arrow}${m}</div>`;
                });
                oled.innerHTML = html;
            } else if (state === 'writing') {
                const current = data.examples[mod][lang][ex];
                const examples = data.examples[mod][lang];
                let html = `<div class="colored-text">PRACTICE: ${mod.toUpperCase()}</div><div>================</div>`;
                html += `<div class="colored-bg">Write: ${current}</div><div>----------------</div>`;
                html += '<div>Follow the blue dots</div>';
                html += '<div>Draw on white screen</div>';
                html += '<div>----------------</div>';
                html += '<div>Examples:</div>';
                examples.forEach((e, i) => {
                    const marker = i === ex ? '▶ ' : '  ';
                    const color = i === ex ? 'colored-text' : '';
                    html += `<div class="${color}">${marker}${e}</div>`;
                });
                oled.innerHTML = html;
            }
        }

        function start() {
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome').style.display = 'none';
                update();
            }, 500);
        }

        function performSearch() {
            if (!searchQuery.trim()) return;
            
            const responses = [
                `${searchQuery} is great for learning!`,
                `About ${searchQuery}: Very educational topic!`,
                `${searchQuery} helps develop skills!`,
                `Great question about ${searchQuery}!`
            ];
            
            searchResult = responses[Math.floor(Math.random() * responses.length)];
            update();
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', resize);
        document.addEventListener('keydown', e => {
            if (searchMode) {
                if (e.key === 'Backspace') {
                    searchQuery = searchQuery.slice(0, -1);
                    update();
                } else if (e.key === 'Enter') {
                    performSearch();
                } else if (e.key === 'Escape') {
                    toggleSearch();
                } else if (e.key.length === 1) {
                    searchQuery += e.key;
                    update();
                }
            } else {
                if (e.key === 'ArrowUp') nav('up');
                if (e.key === 'ArrowDown') nav('down');
                if (e.key === 'Enter') nav('select');
                if (e.key === 'Escape') nav('back');
                if (e.key === ' ') clearDraw();
            }
        });
    </script>
</body>
</html>
