<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Handwriting Learning Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .device-container {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 900px;
            height: 600px;
            display: flex;
            gap: 20px;
        }

        .device-left {
            flex: 0 0 200px;
            background: #34495e;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .oled-display {
            background: #000;
            color: #0ff;
            border-radius: 8px;
            padding: 10px;
            height: 300px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border: 2px solid #555;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .menu-item {
            padding: 3px;
            margin: 1px 0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 10px;
        }

        .menu-item.active {
            background: #0ff;
            color: #000;
        }

        .device-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-button:hover {
            background: #c0392b;
        }

        .search-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .search-button:hover {
            background: #229954;
        }

        .device-right {
            flex: 1;
            background: #ecf0f1;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
        }

        .epaper-display {
            flex: 1;
            background: #fff;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .drawing-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .guide-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3498db;
            border-radius: 50%;
            opacity: 0.7;
        }

        .feedback-area {
            background: #34495e;
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            background: #2c3e50;
            height: 15px;
            border-radius: 10px;
            margin: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .colored-text { color: #ff6b6b; }
        .colored-bg { background: #4ecdc4; color: #000; padding: 2px; border-radius: 2px; }

        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .start-button {
            background: #3498db;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
        }

        .search-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .search-result {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="device-left">
            <div class="oled-display" id="oledDisplay"></div>
            <div class="device-controls">
                <button class="nav-button" onclick="navigateUp()">▲ UP</button>
                <button class="nav-button" onclick="selectModule()">SELECT</button>
                <button class="nav-button" onclick="navigateDown()">▼ DOWN</button>
                <button class="nav-button" onclick="goBack()">◀ BACK</button>
                <button class="nav-button" onclick="clearCanvas()">CLEAR</button>
                <button class="search-button" onclick="openSearch()">🔍 SEARCH</button>
            </div>
        </div>

        <div class="device-right">
            <div class="welcome-screen" id="welcomeScreen">
                <div style="font-size: 48px; color: #3498db; margin-bottom: 20px;">✏️ Handwriting Helper</div>
                <div style="font-size: 24px; color: #7f8c8d; margin-bottom: 40px;">Learn to write in multiple languages!</div>
                <button class="start-button" onclick="startDevice()">Start Learning</button>
            </div>

            <div class="search-overlay" id="searchOverlay">
                <div class="search-box">
                    <h3>Ask AI Anything!</h3>
                    <input type="text" class="search-input" id="searchInput" placeholder="Type your question here...">
                    <button class="start-button" onclick="performSearch()">Search</button>
                    <button class="nav-button" onclick="closeSearch()" style="margin-left: 10px;">Close</button>
                    <div class="search-result" id="searchResult" style="display: none;"></div>
                </div>
            </div>

            <div class="epaper-display" id="epaperDisplay">
                <div class="guide-dots" id="guideDots"></div>
                <canvas class="drawing-canvas" id="drawingCanvas"></canvas>
            </div>
            
            <div class="feedback-area" id="feedbackArea">Welcome! Select a learning module to start.</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        let state = 'menu';
        let selectedItem = 0;
        let currentLang = 'english';
        let currentModule = '';
        let currentExample = 0;
        let progress = 0;
        let canvas, ctx;
        let isDrawing = false;
        let userStrokes = [];

        const data = {
            languages: ['English', '中文', '日本語', 'Deutsch'],
            langCodes: ['english', 'chinese', 'japanese', 'german'],
            modules: ['Alphabet', 'Numbers', 'Cursive', 'Rhymes', 'Stories'],
            examples: {
                alphabet: {
                    english: ['A = Apple 🍎', 'B = Ball ⚽', 'C = Cat 🐱'],
                    chinese: ['一 = One 1️⃣', '二 = Two 2️⃣', '三 = Three 3️⃣'],
                    japanese: ['あ = A あひる', 'い = I いぬ', 'う = U うし'],
                    german: ['A = Apfel 🍎', 'B = Ball ⚽', 'C = Katze 🐱']
                },
                numbers: {
                    english: ['1 = One 1️⃣', '2 = Two 2️⃣', '3 = Three 3️⃣'],
                    chinese: ['1 = 一 壹', '2 = 二 贰', '3 = 三 叁'],
                    japanese: ['1 = 一 いち', '2 = 二 に', '3 = 三 さん'],
                    german: ['1 = Eins 1️⃣', '2 = Zwei 2️⃣', '3 = Drei 3️⃣']
                },
                cursive: {
                    english: ['𝒜 = Apple', '𝐵 = Ball', '𝒞 = Cat'],
                    chinese: ['行书 一', '行书 二', '行书 三'],
                    japanese: ['ひらがな あ', 'ひらがな い', 'ひらがな う'],
                    german: ['𝒜 = Apfel', '𝐵 = Ball', '𝒞 = Katze']
                },
                rhymes: {
                    english: ['🍎 A for Apple', '🐻 B for Bear', '🐱 C for Cat'],
                    chinese: ['小兔子乖乖', '两只老虎', '小星星'],
                    japanese: ['あめふり', 'ももたろう', 'うさぎと亀'],
                    german: ['🍎 A für Apfel', '🐻 B für Bär', '🐱 C für Katze']
                },
                stories: {
                    english: ['Three Pigs 🐷', 'Goldilocks 👧', 'Red Hood 🔴'],
                    chinese: ['三只小猪 🐷', '小红帽 🔴', '白雪公主 👸'],
                    japanese: ['三匹の子豚 🐷', '桃太郎 🍑', '浦島太郎 🐢'],
                    german: ['Drei Schweine 🐷', 'Rotkäppchen 🔴', 'Schneewittchen 👸']
                }
            }
        };

        const dotPatterns = {
            'A': [{x: 50, y: 20}, {x: 50, y: 35}, {x: 50, y: 50}, {x: 40, y: 65}, {x: 60, y: 65}, {x: 45, y: 45}, {x: 55, y: 45}],
            'B': [{x: 40, y: 20}, {x: 40, y: 35}, {x: 40, y: 50}, {x: 40, y: 65}, {x: 55, y: 20}, {x: 55, y: 42}, {x: 55, y: 65}],
            'C': [{x: 60, y: 25}, {x: 50, y: 20}, {x: 40, y: 25}, {x: 40, y: 60}, {x: 50, y: 65}, {x: 60, y: 60}],
            '1': [{x: 50, y: 20}, {x: 50, y: 35}, {x: 50, y: 50}, {x: 50, y: 65}, {x: 45, y: 25}],
            '2': [{x: 40, y: 25}, {x: 50, y: 20}, {x: 60, y: 25}, {x: 50, y: 42}, {x: 40, y: 60}, {x: 60, y: 65}],
            '3': [{x: 40, y: 25}, {x: 50, y: 20}, {x: 60, y: 25}, {x: 50, y: 42}, {x: 60, y: 60}, {x: 50, y: 65}],
            '一': [{x: 30, y: 45}, {x: 50, y: 45}, {x: 70, y: 45}],
            '二': [{x: 30, y: 35}, {x: 50, y: 35}, {x: 70, y: 35}, {x: 30, y: 55}, {x: 50, y: 55}, {x: 70, y: 55}],
            '三': [{x: 30, y: 30}, {x: 50, y: 30}, {x: 70, y: 30}, {x: 30, y: 45}, {x: 50, y: 45}, {x: 70, y: 45}, {x: 30, y: 60}, {x: 50, y: 60}, {x: 70, y: 60}],
            'あ': [{x: 45, y: 25}, {x: 55, y: 30}, {x: 50, y: 40}, {x: 45, y: 50}, {x: 55, y: 55}, {x: 50, y: 65}],
            'い': [{x: 45, y: 20}, {x: 45, y: 35}, {x: 45, y: 50}, {x: 45, y: 65}, {x: 55, y: 25}, {x: 55, y: 60}],
            'う': [{x: 40, y: 25}, {x: 50, y: 20}, {x: 60, y: 25}, {x: 50, y: 35}, {x: 40, y: 50}, {x: 60, y: 60}]
        };

        function init() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupDrawing();
            updateDisplay();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
        }

        function setupDrawing() {
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e.touches[0]); });
            canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
            canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(); });
        }

        function startDraw(e) {
            if (state !== 'writing') return;
            isDrawing = true;
            userStrokes = [];
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
            userStrokes.push({x, y});
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            userStrokes.push({x, y});
        }

        function endDraw() {
            if (!isDrawing) return;
            isDrawing = false;
            if (userStrokes.length > 5) {
                setTimeout(checkWriting, 500);
            }
        }

        function checkWriting() {
            const isCorrect = Math.random() > 0.3;
            if (isCorrect) {
                progress += 33;
                updateProgress();
                updateFeedback('✅ Correct! Great job!');
                if (progress >= 100) {
                    setTimeout(() => {
                        currentExample++;
                        if (currentExample >= data.examples[currentModule][currentLang].length) {
                            updateFeedback('🎉 Module completed!');
                            setTimeout(goToModules, 2000);
                        } else {
                            progress = 0;
                            updateProgress();
                            showExample();
                        }
                    }, 2000);
                }
            } else {
                updateFeedback('❌ Try again! Follow the dots.');
            }
        }

        function navigateUp() {
            if (state === 'menu') {
                selectedItem = (selectedItem - 1 + data.languages.length) % data.languages.length;
            } else if (state === 'modules') {
                selectedItem = (selectedItem - 1 + data.modules.length) % data.modules.length;
            }
            updateDisplay();
        }

        function navigateDown() {
            if (state === 'menu') {
                selectedItem = (selectedItem + 1) % data.languages.length;
            } else if (state === 'modules') {
                selectedItem = (selectedItem + 1) % data.modules.length;
            }
            updateDisplay();
        }

        function selectModule() {
            if (state === 'menu') {
                currentLang = data.langCodes[selectedItem];
                state = 'modules';
                selectedItem = 0;
                updateDisplay();
                updateFeedback('Select a module to practice');
            } else if (state === 'modules') {
                currentModule = data.modules[selectedItem].toLowerCase();
                currentExample = 0;
                progress = 0;
                state = 'writing';
                showExample();
            }
        }

        function showExample() {
            const example = data.examples[currentModule][currentLang][currentExample];
            const char = example.split(' ')[0];
            
            showDots(char);
            updateOLED();
            updateFeedback(`Practice writing: ${char}`);
            clearCanvas();
        }

        function showDots(char) {
            const dotsContainer = document.getElementById('guideDots');
            dotsContainer.innerHTML = '';
            
            const pattern = dotPatterns[char] || [{x: 50, y: 45}];
            pattern.forEach((dot, i) => {
                const dotEl = document.createElement('div');
                dotEl.className = 'dot';
                dotEl.style.left = dot.x + '%';
                dotEl.style.top = dot.y + '%';
                dotEl.style.animationDelay = (i * 0.2) + 's';
                dotsContainer.appendChild(dotEl);
            });
        }

        function goBack() {
            if (state === 'writing') {
                goToModules();
            } else if (state === 'modules') {
                state = 'menu';
                selectedItem = 0;
                updateDisplay();
                updateFeedback('Select your language');
            }
        }

        function goToModules() {
            state = 'modules';
            selectedItem = 0;
            progress = 0;
            updateProgress();
            updateDisplay();
            updateFeedback('Select a module to practice');
            clearCanvas();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateFeedback(msg) {
            document.getElementById('feedbackArea').textContent = msg;
        }

        function updateProgress() {
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateDisplay() {
            updateOLED();
        }

        function updateOLED() {
            const oled = document.getElementById('oledDisplay');
            
            if (state === 'menu') {
                let html = '<div class="colored-text">SELECT LANGUAGE</div><div>================</div>';
                data.languages.forEach((lang, i) => {
                    const active = i === selectedItem ? 'active' : '';
                    const arrow = i === selectedItem ? '▶ ' : '  ';
                    html += `<div class="menu-item ${active}">${arrow}${lang}</div>`;
                });
                oled.innerHTML = html;
            } else if (state === 'modules') {
                let html = '<div class="colored-text">SELECT MODULE</div><div>================</div>';
                html += `<div class="colored-bg">Language: ${data.languages[data.langCodes.indexOf(currentLang)]}</div><div>----------------</div>`;
                data.modules.forEach((mod, i) => {
                    const active = i === selectedItem ? 'active' : '';
                    const arrow = i === selectedItem ? '▶ ' : '  ';
                    html += `<div class="menu-item ${active}">${arrow}${mod}</div>`;
                });
                oled.innerHTML = html;
            } else if (state === 'writing') {
                const examples = data.examples[currentModule][currentLang];
                let html = `<div class="colored-text">${currentModule.toUpperCase()}</div><div>================</div>`;
                html += `<div class="colored-bg">${examples[currentExample]}</div><div>----------------</div>`;
                html += `<div>Progress: ${Math.floor(progress)}%</div><div>Examples:</div>`;
                examples.forEach((ex, i) => {
                    const marker = i === currentExample ? '▶ ' : '  ';
                    const color = i === currentExample ? 'colored-text' : '';
                    html += `<div class="${color}">${marker}${ex}</div>`;
                });
                oled.innerHTML = html;
            }
        }

        function startDevice() {
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
                state = 'menu';
                updateDisplay();
                updateFeedback('Select your language');
            }, 500);
        }

        function openSearch() {
            document.getElementById('searchOverlay').style.display = 'flex';
            document.getElementById('searchInput').focus();
        }

        function closeSearch() {
            document.getElementById('searchOverlay').style.display = 'none';
            document.getElementById('searchResult').style.display = 'none';
            document.getElementById('searchInput').value = '';
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultDiv = document.getElementById('searchResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '🔍 Searching...';

            try {
                // Simulate AI search response
                const responses = [
                    "Here's what I found: " + query + " is a fascinating topic! Let me explain...",
                    "Great question! Based on my knowledge, " + query + " can be understood as...",
                    "I'd be happy to help with that! " + query + " is something that...",
                    "Interesting! " + query + " is related to many concepts including...",
                    "Let me break this down for you: " + query + " involves..."
                ];
                
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                
                setTimeout(() => {
                    resultDiv.innerHTML = `<strong>AI Response:</strong><br><br>${randomResponse}<br><br>This is a simulated response. In a real implementation, this would connect to an actual AI search API to provide accurate, real-time answers to your questions.`;
                }, 1500);
                
            } catch (error) {
                resultDiv.innerHTML = 'Sorry, there was an error with the search. Please try again.';
            }
        }

        window.addEventListener('load', init);
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') navigateUp();
            if (e.key === 'ArrowDown') navigateDown();
            if (e.key === 'Enter') selectModule();
            if (e.key === 'Escape') goBack();
            if (e.key === ' ') clearCanvas();
        });

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
