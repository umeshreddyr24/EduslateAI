<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSlate - Child Development Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .eduslate {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 1200px;
            height: 700px;
            display: flex;
            gap: 20px;
        }
        .control-panel {
            flex: 0 0 280px;
            background: #34495e;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .screen {
            background: #000;
            color: #0ff;
            border-radius: 8px;
            padding: 10px;
            height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border: 2px solid #555;
            overflow-y: auto;
        }
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { background: #c0392b; transform: scale(1.05); }
        .btn.active { background: #27ae60; }
        .btn.special { background: #f39c12; }
        .btn.purple { background: #9b59b6; }
        .main-area {
            flex: 1;
            background: #ecf0f1;
            border-radius: 15px;
            padding: 15px;
            position: relative;
        }
        .canvas-area {
            width: 100%;
            height: 100%;
            background: #fff;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            position: relative;
            cursor: crosshair;
        }
        .canvas { width: 100%; height: 100%; position: absolute; z-index: 3; }
        .dots { position: absolute; width: 100%; height: 100%; z-index: 2; }
        .content { position: absolute; width: 100%; height: 100%; z-index: 1; padding: 20px; }
        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #3498db;
            border-radius: 50%;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 0.3; } }
        .task-item {
            background: #f8f9fa;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 4px solid #3498db;
            font-size: 12px;
        }
        .task-item.complete { background: #d4edda; border-left-color: #28a745; }
        .welcome {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 10px;
        }
        .start-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        .colored-text { color: #ff6b6b; }
        .colored-bg { background: #4ecdc4; color: #000; padding: 2px; border-radius: 2px; }
        .menu-item { padding: 2px; margin: 1px 0; border-radius: 3px; }
        .menu-item.active { background: #0ff; color: #000; }
        .progress-bar {
            background: #2c3e50;
            height: 6px;
            border-radius: 3px;
            margin: 5px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: #27ae60;
            height: 100%;
            transition: width 0.3s;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .stat-box {
            background: #2c3e50;
            color: white;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-size: 10px;
        }
        .input-area {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .input-area input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="eduslate">
        <div class="control-panel">
            <div class="screen" id="screen"></div>
            <div class="nav-buttons">
                <button class="btn" onclick="nav('up')">▲ UP</button>
                <button class="btn" onclick="nav('down')">▼ DOWN</button>
                <button class="btn" onclick="nav('select')">SELECT</button>
                <button class="btn" onclick="nav('back')">◀ BACK</button>
                <button class="btn active" onclick="changeMode('dashboard')">📊 DASH</button>
                <button class="btn" onclick="changeMode('handwriting')">✏️ WRITE</button>
                <button class="btn special" onclick="changeMode('tasks')">📋 TASKS</button>
                <button class="btn purple" onclick="changeMode('journal')">📝 JOURNAL</button>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <div>Tasks: <span id="taskCount">2/3</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 66%"></div></div>
                </div>
                <div class="stat-box">
                    <div>Coins: <span id="coinCount">25</span></div>
                    <div>Level: <span id="level">3</span></div>
                </div>
            </div>
        </div>
        
        <div class="main-area">
            <div class="welcome" id="welcome">
                <div style="font-size: 64px; margin-bottom: 20px;">🎓</div>
                <div style="font-size: 32px; margin-bottom: 10px;">EduSlate</div>
                <div style="font-size: 18px; opacity: 0.8;">Your Complete Learning Companion</div>
                <button class="start-btn" onclick="start()">Start Learning</button>
            </div>
            
            <div class="canvas-area">
                <div class="dots" id="dots"></div>
                <div class="content" id="content"></div>
                <canvas class="canvas" id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let state = {
            mode: 'dashboard',
            menu: 0,
            child: { name: 'Alex', age: 8, level: 3, coins: 25 },
            tasks: [
                { id: 1, title: 'Practice letter A', complete: false, type: 'handwriting' },
                { id: 2, title: 'Read 5 minutes', complete: true, type: 'reading' },
                { id: 3, title: 'Write in journal', complete: true, type: 'journal' }
            ],
            journal: ['Today I learned letter A! It was fun.'],
            handwriting: { current: 'A', progress: 0 },
            drawing: false,
            canvas: null,
            ctx: null
        };

        const dots = {
            'A': [{x: 50, y: 20}, {x: 40, y: 40}, {x: 60, y: 40}, {x: 30, y: 60}, {x: 70, y: 60}, {x: 45, y: 45}, {x: 55, y: 45}],
            'B': [{x: 30, y: 20}, {x: 30, y: 40}, {x: 30, y: 60}, {x: 30, y: 80}, {x: 50, y: 20}, {x: 50, y: 40}, {x: 50, y: 60}, {x: 50, y: 80}],
            'C': [{x: 60, y: 25}, {x: 50, y: 20}, {x: 35, y: 25}, {x: 30, y: 40}, {x: 30, y: 60}, {x: 35, y: 75}, {x: 50, y: 80}, {x: 60, y: 75}],
            '1': [{x: 50, y: 20}, {x: 50, y: 40}, {x: 50, y: 60}, {x: 50, y: 80}, {x: 45, y: 25}],
            '2': [{x: 35, y: 25}, {x: 50, y: 20}, {x: 65, y: 25}, {x: 50, y: 40}, {x: 35, y: 55}, {x: 50, y: 70}, {x: 65, y: 80}]
        };

        function init() {
            state.canvas = document.getElementById('canvas');
            state.ctx = state.canvas.getContext('2d');
            resize();
            setupDraw();
            update();
        }

        function resize() {
            const rect = state.canvas.getBoundingClientRect();
            state.canvas.width = rect.width;
            state.canvas.height = rect.height;
            state.ctx.strokeStyle = '#2c3e50';
            state.ctx.lineWidth = 4;
            state.ctx.lineCap = 'round';
        }

        function setupDraw() {
            state.canvas.addEventListener('mousedown', startDraw);
            state.canvas.addEventListener('mousemove', draw);
            state.canvas.addEventListener('mouseup', endDraw);
            state.canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e.touches[0]); });
            state.canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
            state.canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(); });
        }

        function startDraw(e) {
            if (state.mode !== 'handwriting') return;
            state.drawing = true;
            const rect = state.canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            state.ctx.beginPath();
            state.ctx.moveTo(x, y);
        }

        function draw(e) {
            if (!state.drawing) return;
            const rect = state.canvas.getBoundingClientRect();
            const x = (e.clientX || e.offsetX) - rect.left;
            const y = (e.clientY || e.offsetY) - rect.top;
            state.ctx.lineTo(x, y);
            state.ctx.stroke();
        }

        function endDraw() {
            if (!state.drawing) return;
            state.drawing = false;
            if (state.mode === 'handwriting') {
                setTimeout(() => {
                    const correct = Math.random() > 0.3;
                    if (correct) {
                        state.handwriting.progress++;
                        state.child.coins += 5;
                        showMessage(`✅ Great job! +5 coins`);
                        if (state.handwriting.progress >= 3) {
                            completeTask(1);
                            state.handwriting.current = ['B', 'C', '1', '2'][Math.floor(Math.random() * 4)];
                            state.handwriting.progress = 0;
                        }
                    } else {
                        showMessage(`❌ Try again! Follow the dots`);
                    }
                    update();
                }, 500);
            }
        }

        function nav(action) {
            if (action === 'up') state.menu = Math.max(0, state.menu - 1);
            if (action === 'down') state.menu = Math.min(2, state.menu + 1);
            if (action === 'select') handleSelect();
            if (action === 'back') state.menu = 0;
            update();
        }

        function handleSelect() {
            if (state.mode === 'tasks' && state.menu < state.tasks.length) {
                toggleTask(state.tasks[state.menu].id);
            }
        }

        function changeMode(mode) {
            state.mode = mode;
            state.menu = 0;
            clearCanvas();
            update();
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.complete = !task.complete;
                state.child.coins += task.complete ? 10 : -10;
                update();
            }
        }

        function completeTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task && !task.complete) {
                task.complete = true;
                state.child.coins += 15;
                showMessage(`🎉 Task completed! +15 coins`);
            }
        }

        function showMessage(msg) {
            const screen = document.getElementById('screen');
            screen.innerHTML = `<div class="colored-text">NOTIFICATION</div><div>================</div><div>${msg}</div>`;
            setTimeout(update, 2000);
        }

        function showDots(char) {
            const container = document.getElementById('dots');
            container.innerHTML = '';
            const pattern = dots[char] || [{x: 50, y: 50}];
            pattern.forEach(dot => {
                const el = document.createElement('div');
                el.className = 'dot';
                el.style.left = dot.x + '%';
                el.style.top = dot.y + '%';
                container.appendChild(el);
            });
        }

        function clearCanvas() {
            if (state.ctx) state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
            document.getElementById('dots').innerHTML = '';
        }

        function update() {
            const screen = document.getElementById('screen');
            const content = document.getElementById('content');
            const completed = state.tasks.filter(t => t.complete).length;
            
            document.getElementById('taskCount').textContent = `${completed}/${state.tasks.length}`;
            document.getElementById('coinCount').textContent = state.child.coins;
            document.getElementById('level').textContent = state.child.level;
            
            const progress = (completed / state.tasks.length) * 100;
            document.querySelector('.progress-fill').style.width = progress + '%';

            if (state.mode === 'dashboard') {
                let html = `<div class="colored-text">DASHBOARD</div><div>================</div>`;
                html += `<div class="colored-bg">Welcome ${state.child.name}!</div><div>----------------</div>`;
                html += `<div>Level: ${state.child.level}</div>`;
                html += `<div>Coins: ${state.child.coins}</div>`;
                html += `<div>Tasks: ${completed}/${state.tasks.length}</div>`;
                html += `<div>Progress: ${Math.round(progress)}%</div>`;
                html += `<div>----------------</div>`;
                html += `<div>🎯 Current Goal:</div>`;
                html += `<div>Complete handwriting</div>`;
                screen.innerHTML = html;
                
                content.innerHTML = `
                    <div style="text-align: center; margin-top: 100px;">
                        <div style="font-size: 48px; margin-bottom: 20px;">🎓</div>
                        <h2>Welcome ${state.child.name}!</h2>
                        <p>Level ${state.child.level} • ${state.child.coins} coins</p>
                        <div style="margin-top: 30px;">
                            <div style="font-size: 24px; margin-bottom: 10px;">Today's Progress</div>
                            <div style="background: #ecf0f1; padding: 20px; border-radius: 10px;">
                                <div>✅ Tasks Completed: ${completed}/${state.tasks.length}</div>
                                <div>📝 Journal Entries: ${state.journal.length}</div>
                                <div>✏️ Handwriting Progress: ${state.handwriting.progress}/3</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.mode === 'handwriting') {
                let html = `<div class="colored-text">HANDWRITING</div><div>================</div>`;
                html += `<div class="colored-bg">Practice: ${state.handwriting.current}</div><div>----------------</div>`;
                html += `<div>Progress: ${state.handwriting.progress}/3</div>`;
                html += `<div>Follow blue dots</div>`;
                html += `<div>Draw on white area</div>`;
                html += `<div>----------------</div>`;
                html += `<div>🎯 Instructions:</div>`;
                html += `<div>1. Follow the dots</div>`;
                html += `<div>2. Draw carefully</div>`;
                html += `<div>3. Complete 3 times</div>`;
                screen.innerHTML = html;
                
                showDots(state.handwriting.current);
                content.innerHTML = `
                    <div style="text-align: center; margin-top: 50px; color: #7f8c8d;">
                        <div style="font-size: 72px; margin-bottom: 20px;">${state.handwriting.current}</div>
                        <div style="font-size: 18px;">Practice writing this letter</div>
                        <div style="font-size: 14px; margin-top: 10px;">Progress: ${state.handwriting.progress}/3</div>
                    </div>
                `;
            } else if (state.mode === 'tasks') {
                let html = `<div class="colored-text">TASK LIST</div><div>================</div>`;
                state.tasks.forEach((task, i) => {
                    const active = i === state.menu ? 'active' : '';
                    const arrow = i === state.menu ? '▶ ' : '  ';
                    const status = task.complete ? '✅' : '❌';
                    html += `<div class="menu-item ${active}">${arrow}${status} ${task.title}</div>`;
                });
                html += `<div>----------------</div>`;
                html += `<div>SELECT to toggle</div>`;
                screen.innerHTML = html;
                
                content.innerHTML = `
                    <div style="padding: 20px;">
                        <h2 style="margin-bottom: 20px;">📋 Daily Tasks</h2>
                        ${state.tasks.map(task => `
                            <div class="task-item ${task.complete ? 'complete' : ''}">
                                <div style="font-weight: bold;">${task.complete ? '✅' : '⏳'} ${task.title}</div>
                                <div style="color: #666; font-size: 10px;">${task.type} • ${task.complete ? 'Complete' : 'Pending'}</div>
                            </div>
                        `).join('')}
                        <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <strong>💡 Tip:</strong> Complete all tasks to earn bonus coins!
                        </div>
                    </div>
                `;
            } else if (state.mode === 'journal') {
                let html = `<div class="colored-text">JOURNAL</div><div>================</div>`;
                html += `<div class="colored-bg">Daily Writing</div><div>----------------</div>`;
                html += `<div>Entries: ${state.journal.length}</div>`;
                html += `<div>Last: Today</div>`;
                html += `<div>----------------</div>`;
                html += `<div>💭 Recent entry:</div>`;
                html += `<div>"${state.journal[state.journal.length - 1]}"</div>`;
                screen.innerHTML = html;
                
                content.innerHTML = `
                    <div style="padding: 20px;">
                        <h2 style="margin-bottom: 20px;">📝 My Journal</h2>
                        ${state.journal.map((entry, i) => `
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #3498db;">
                                <div style="font-size: 12px; color: #666;">Day ${i + 1}</div>
                                <div style="margin-top: 5px;">${entry}</div>
                            </div>
                        `).join('')}
                        <div class="input-area">
                            <input type="text" placeholder="Write about your day..." onkeypress="if(event.key==='Enter') addJournalEntry(this.value, this)">
                            <button class="btn" onclick="addJournalEntry(this.previousElementSibling.value, this.previousElementSibling)" style="margin-top: 5px; width: 100%;">Add Entry</button>
                        </div>
                    </div>
                `;
            }
        }

        function addJournalEntry(text, input) {
            if (text.trim()) {
                state.journal.push(text.trim());
                state.child.coins += 5;
                input.value = '';
                showMessage(`📝 Journal entry added! +5 coins`);
                completeTask(3);
            }
        }

        function start() {
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome').style.display = 'none';
                update();
            }, 500);
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', resize);
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') nav('up');
            if (e.key === 'ArrowDown') nav('down');
            if (e.key === 'Enter') nav('select');
            if (e.key === 'Escape') nav('back');
        });
    </script>
</body>
</html>
