<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Handwriting Learning Device - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .device-container {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 900px;
            height: 600px;
            position: relative;
            display: flex;
            gap: 20px;
        }

        .device-left {
            flex: 0 0 200px;
            background: #34495e;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .oled-display {
            background: #000;
            color: #0ff;
            border-radius: 8px;
            padding: 10px;
            height: 240px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 2px solid #555;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .menu-item {
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-item.active {
            background: #0ff;
            color: #000;
        }

        .menu-item:hover {
            background: #333;
        }

        .device-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .nav-button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .nav-button:active {
            transform: translateY(0);
        }

        .device-right {
            flex: 1;
            background: #ecf0f1;
            border-radius: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .epaper-display {
            flex: 1;
            background: #fff;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .drawing-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .guidance-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .letter-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            color: #e8e8e8;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        .guide-dots {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3498db;
            border-radius: 50%;
            opacity: 0.7;
        }

        .feedback-area {
            background: #34495e;
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speaker {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: #2c3e50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .speaker:hover {
            background: #3498db;
        }

        .speaker.playing {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .progress-bar {
            background: #2c3e50;
            height: 20px;
            border-radius: 10px;
            margin: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .status-lights {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #7f8c8d;
        }

        .status-light.active {
            background: #27ae60;
            box-shadow: 0 0 10px #27ae60;
        }

        .ai-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(52, 73, 94, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: none;
        }

        .ai-indicator.processing {
            display: block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .welcome-title {
            font-size: 48px;
            color: black;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .welcome-subtitle {
            font-size: 24px;
            color: #7f8c8d;
            margin-bottom: 40px;
        }

        .start-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 16px rgba(52, 152, 219, 0.3);
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(52, 152, 219, 0.4);
        }

        .celebration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: #f39c12;
            z-index: 20;
            display: none;
            animation: celebrate 2s ease-out;
        }

        @keyframes celebrate {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.3) rotate(180deg); 
                opacity: 1; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(1) rotate(360deg); 
                opacity: 1; 
            }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <!-- Left Panel: OLED Display and Controls -->
        <div class="device-left">
            <div class="oled-display" id="oledDisplay">
                <div>HANDWRITING HELPER</div>
                <div>================</div>
                <div id="menuContent">
                    <div class="menu-item active" data-module="alphabet">▶ Alphabet</div>
                    <div class="menu-item" data-module="numbers">  Numbers</div>
                    <div class="menu-item" data-module="cursive">  Cursive</div>
                    <div class="menu-item" data-module="rhymes">  Rhymes</div>
                    <div class="menu-item" data-module="stories">  Stories</div>
                </div>
            </div>
            
            <div class="device-controls">
                <button class="nav-button" onclick="navigateUp()">▲ UP</button>
                <button class="nav-button" onclick="selectModule()">SELECT</button>
                <button class="nav-button" onclick="navigateDown()">▼ DOWN</button>
                <button class="nav-button" onclick="goBack()">◀ BACK</button>
                <button class="nav-button" onclick="clearCanvas()">CLEAR</button>
            </div>
        </div>

        <!-- Right Panel: E-paper Display -->
        <div class="device-right">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-title">✏️ EduSlate_AI</div>
                <div class="welcome-subtitle">Learn to write with AI guidance!</div>
                <button class="start-button" onclick="startDevice()">Start Learning</button>
            </div>

            <!-- Main Display Area -->
            <div class="epaper-display" id="epaperDisplay">
                <div class="speaker" id="speaker" onclick="playAudio()">🔊</div>
                <div class="ai-indicator" id="aiIndicator">🤖 AI Processing...</div>
                
                <div class="guidance-overlay" id="guidanceOverlay">
                    <div class="letter-guide" id="letterGuide">A</div>
                </div>
                
                <canvas class="drawing-canvas" id="drawingCanvas"></canvas>
                
                <div class="celebration" id="celebration">🌟 Great Job! 🌟</div>
            </div>
            
            <div class="feedback-area" id="feedbackArea">
                Welcome! Select a learning module to start.
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="status-lights">
                <div class="status-light active" title="Power"></div>
                <div class="status-light" id="aiStatus" title="AI Model"></div>
                <div class="status-light" id="audioStatus" title="Audio"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentState = 'menu';
        let currentModule = 'alphabet';
        let selectedMenuItem = 0;
        let currentLetter = 'A';
        let isDrawing = false;
        let drawingPath = [];
        let canvas, ctx;
        let progress = 0;
        let aiProcessing = false;

        // Initialize the application
        function initializeApp() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Set up drawing events
            setupDrawingEvents();
            
            // Initialize AI status
            setTimeout(() => {
                document.getElementById('aiStatus').classList.add('active');
                document.getElementById('audioStatus').classList.add('active');
                updateFeedback('All systems ready! 🚀');
            }, 2000);
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Set drawing styles
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function setupDrawingEvents() {
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events for mobile
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            if (e.type === 'touchstart') {
                startDrawing({offsetX: x, offsetY: y});
            } else if (e.type === 'touchmove') {
                draw({offsetX: x, offsetY: y});
            }
        }

        function startDrawing(e) {
            if (currentState !== 'writing') return;
            
            isDrawing = true;
            drawingPath = [];
            
            const point = {x: e.offsetX, y: e.offsetY, timestamp: Date.now()};
            drawingPath.push(point);
            
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
            
            // Haptic feedback simulation
            navigator.vibrate && navigator.vibrate(10);
        }

        function draw(e) {
            if (!isDrawing || currentState !== 'writing') return;
            
            const point = {x: e.offsetX, y: e.offsetY, timestamp: Date.now()};
            drawingPath.push(point);
            
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            
            isDrawing = false;
            
            if (drawingPath.length > 5) {
                // Simulate AI processing
                processHandwriting();
            }
        }

        function processHandwriting() {
            aiProcessing = true;
            document.getElementById('aiIndicator').classList.add('processing');
            updateFeedback('🤖 Analyzing your handwriting...');
            
            setTimeout(() => {
                const result = simulateAIRecognition();
                aiProcessing = false;
                document.getElementById('aiIndicator').classList.remove('processing');
                
                if (result.recognized === currentLetter) {
                    handleCorrectRecognition();
                } else {
                    handleIncorrectRecognition(result.recognized);
                }
            }, 1500);
        }

        function simulateAIRecognition() {
            // Simple simulation - randomly decide if recognition is correct
            const accuracy = 0.8; // 80% accuracy
            const isCorrect = Math.random() < accuracy;
            
            if (isCorrect) {
                return {recognized: currentLetter, confidence: 0.85 + Math.random() * 0.1};
            } else {
                // Pick a random wrong letter
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const wrongLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
                return {recognized: wrongLetter, confidence: 0.6 + Math.random() * 0.2};
            }
        }

        function handleCorrectRecognition() {
            showCelebration();
            updateFeedback(`🎉 Perfect! You wrote "${currentLetter}" correctly!`);
            playSuccessSound();
            
            // Update progress
            progress += 10;
            updateProgress();
            
            setTimeout(() => {
                if (progress >= 100) {
                    completeLessonMode();
                } else {
                    nextLetter();
                }
            }, 2000);
        }

        function handleIncorrectRecognition(recognized) {
            updateFeedback(`🤔 I saw "${recognized}". Try writing "${currentLetter}" again!`);
            playRetrySound();
            showGuidance();
        }

        function showCelebration() {
            const celebration = document.getElementById('celebration');
            celebration.style.display = 'block';
            setTimeout(() => {
                celebration.style.display = 'none';
            }, 2000);
        }

        function nextLetter() {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const currentIndex = alphabet.indexOf(currentLetter);
            
            if (currentIndex < alphabet.length - 1) {
                currentLetter = alphabet[currentIndex + 1];
                showLetterGuidance(currentLetter);
                clearCanvas();
                updateFeedback(`Now let's practice writing "${currentLetter}"!`);
            } else {
                completeLessonMode();
            }
        }

        function completeLessonMode() {
            updateFeedback('🏆 Congratulations! You completed the lesson!');
            playCompletionSound();
            progress = 100;
            updateProgress();
            
            setTimeout(() => {
                goToMenu();
            }, 3000);
        }

        // Navigation functions
        function navigateUp() {
            if (currentState === 'menu') {
                const menuItems = document.querySelectorAll('.menu-item');
                menuItems[selectedMenuItem].classList.remove('active');
                selectedMenuItem = (selectedMenuItem - 1 + menuItems.length) % menuItems.length;
                menuItems[selectedMenuItem].classList.add('active');
                playNavigationSound();
            }
        }

        function navigateDown() {
            if (currentState === 'menu') {
                const menuItems = document.querySelectorAll('.menu-item');
                menuItems[selectedMenuItem].classList.remove('active');
                selectedMenuItem = (selectedMenuItem + 1) % menuItems.length;
                menuItems[selectedMenuItem].classList.add('active');
                playNavigationSound();
            }
        }

        function selectModule() {
            if (currentState === 'menu') {
                const menuItems = document.querySelectorAll('.menu-item');
                const selectedModule = menuItems[selectedMenuItem].dataset.module;
                startLearningModule(selectedModule);
                playSelectSound();
            }
        }

        function goBack() {
            if (currentState === 'writing') {
                goToMenu();
            }
        }

        function goToMenu() {
            currentState = 'menu';
            progress = 0;
            updateProgress();
            clearCanvas();
            hideGuidance();
            updateFeedback('Select a learning module to start.');
            updateOLEDMenu();
        }

        function startLearningModule(module) {
            currentState = 'writing';
            currentModule = module;
            currentLetter = getStartingLetter(module);
            progress = 0;
            
            showLetterGuidance(currentLetter);
            updateFeedback(`Let's practice writing "${currentLetter}"! Use your finger or stylus to trace.`);
            updateOLEDWritingMode();
            playInstructionSound();
        }

        function getStartingLetter(module) {
            switch(module) {
                case 'alphabet': return 'A';
                case 'numbers': return '1';
                case 'cursive': return 'a';
                default: return 'A';
            }
        }

        // Display functions
        function showLetterGuidance(letter) {
            document.getElementById('letterGuide').textContent = letter;
            showGuidance();
            addGuideDots(letter);
        }

        function showGuidance() {
            document.getElementById('guidanceOverlay').style.display = 'block';
        }

        function hideGuidance() {
            document.getElementById('guidanceOverlay').style.display = 'none';
        }

        function addGuideDots(letter) {
            // Remove existing dots
            const existingDots = document.querySelectorAll('.guide-dots');
            existingDots.forEach(dot => dot.remove());
            
            // Add new dots based on letter (simplified)
            const overlay = document.getElementById('guidanceOverlay');
            const positions = getGuideDotPositions(letter);
            
            positions.forEach((pos, index) => {
                const dot = document.createElement('div');
                dot.className = 'guide-dots';
                dot.style.left = pos.x + '%';
                dot.style.top = pos.y + '%';
                dot.style.animationDelay = (index * 0.2) + 's';
                overlay.appendChild(dot);
            });
        }

        function getGuideDotPositions(letter) {
            // Simplified dot positions for letter 'A'
            switch(letter) {
                case 'A':
                    return [
                        {x: 45, y: 20}, {x: 47, y: 25}, {x: 49, y: 30},
                        {x: 51, y: 35}, {x: 53, y: 40}, {x: 55, y: 45},
                        {x: 45, y: 40}, {x: 55, y: 40}, // Cross bar
                        {x: 40, y: 45}, {x: 38, y: 50}, {x: 36, y: 55},
                        {x: 60, y: 45}, {x: 62, y: 50}, {x: 64, y: 55}
                    ];
                default:
                    return [{x: 50, y: 30}, {x: 50, y: 40}, {x: 50, y: 50}];
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawingPath = [];
        }

        function updateFeedback(message) {
            document.getElementById('feedbackArea').textContent = message;
        }

        function updateProgress() {
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateOLEDMenu() {
            const oled = document.getElementById('oledDisplay');
            oled.innerHTML = `
                <div>HANDWRITING HELPER</div>
                <div>================</div>
                <div id="menuContent">
                    <div class="menu-item ${selectedMenuItem === 0 ? 'active' : ''}" data-module="alphabet">▶ Alphabet</div>
                    <div class="menu-item ${selectedMenuItem === 1 ? 'active' : ''}" data-module="numbers">  Numbers</div>
                    <div class="menu-item ${selectedMenuItem === 2 ? 'active' : ''}" data-module="cursive">  Cursive</div>
                    <div class="menu-item ${selectedMenuItem === 3 ? 'active' : ''}" data-module="rhymes">  Rhymes</div>
                    <div class="menu-item ${selectedMenuItem === 4 ? 'active' : ''}" data-module="stories">  Stories</div>
                </div>
            `;
        }

        function updateOLEDWritingMode() {
            const oled = document.getElementById('oledDisplay');
            oled.innerHTML = `
                <div>WRITING MODE</div>
                <div>============</div>
                <div>Target: ${currentLetter}</div>
                <div>Progress: ${Math.floor(progress)}%</div>
                <div></div>
                <div>Trace the letter!</div>
            `;
        }

        // Audio functions (simulated)
        function playAudio() {
            const speaker = document.getElementById('speaker');
            speaker.classList.add('playing');
            
            // Simulate TTS
            updateFeedback('🔊 ' + getFeedbackMessage());
            
            setTimeout(() => {
                speaker.classList.remove('playing');
            }, 1000);
        }

        function getFeedbackMessage() {
            const messages = [
                "Great job practicing your handwriting!",
                "Keep up the excellent work!",
                "You're getting better every day!",
                "Nice letter formation!",
                "I love seeing your progress!"
            ];
            return messages[Math.floor(Math.random() * messages.length)];
        }

        function playSuccessSound() {
            // Simulate success sound
            console.log('🎵 Playing success sound');
        }

        function playRetrySound() {
            // Simulate retry sound
            console.log('🎵 Playing retry sound');
        }

        function playNavigationSound() {
            // Simulate navigation sound
            console.log('🎵 Playing navigation sound');
        }

        function playSelectSound() {
            // Simulate selection sound
            console.log('🎵 Playing selection sound');
        }

        function playInstructionSound() {
            // Simulate instruction sound
            console.log('🎵 Playing instruction sound');
        }

        function playCompletionSound() {
            // Simulate completion sound
            console.log('🎵 Playing completion sound');
        }

        // Device startup
        function startDevice() {
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
                currentState = 'menu';
                updateFeedback('Select a learning module to start.');
            }, 500);
        }

        // Initialize when page loads
        window.addEventListener('load', initializeApp);

        // Keyboard shortcuts for testing
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': navigateUp(); break;
                case 'ArrowDown': navigateDown(); break;
                case 'Enter': selectModule(); break;
                case 'Escape': goBack(); break;
                case ' ': clearCanvas(); break;
            }
        });
    </script>
</body>
</html>
